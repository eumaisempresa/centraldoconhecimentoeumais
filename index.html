<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Central do Conhecimento EU+ · Painel do Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg: #15181D;
    --surface: #1D222A;
    --surface-2: #262C36;
    --line: #333B47;
    --ink: #ECE8DF;
    --muted: #8B92A0;
    --accent: #E3A94D;      /* amber ficha manila */
    --accent-ink: #2A1E0A;
    --sage: #6E9C87;        /* produtos/projetos */
    --blue: #6E8FB8;        /* documentos */
    --danger: #D9614F;
    --radius: 10px;
    --font-display: 'IBM Plex Serif', serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input{ font-family: inherit; }
  ::selection{ background: var(--accent); color: var(--accent-ink); }
  a{ color: inherit; }

  /* ---------- LOGIN ---------- */
  #tela-login{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .cartao-login{
    width:100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    position: relative;
    overflow: hidden;
  }
  .cartao-login::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background: linear-gradient(90deg, var(--accent), var(--sage), var(--blue));
  }
  .selo{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .cartao-login h1{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.25;
  }
  .cartao-login p.sub{
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 22px;
  }
  label{
    display:block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: .02em;
  }
  input[type="password"], input[type="text"], input[type="search"]{
    width:100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
  }
  input:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(227,169,77,.18); }
  .campo{ margin-bottom: 16px; }
  details.avancado{ margin: 4px 0 20px; }
  details.avancado summary{
    cursor:pointer;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
    list-style: none;
  }
  details.avancado summary::-webkit-details-marker{ display:none; }
  details.avancado[open] summary{ color: var(--accent); }
  details.avancado .campo{ margin-top: 12px; }
  .btn{
    appearance:none;
    border:none;
    border-radius: 8px;
    padding: 13px 18px;
    font-weight: 600;
    font-size: 15px;
    cursor:pointer;
    width:100%;
  }
  .btn-primario{ background: var(--accent); color: var(--accent-ink); }
  .btn-primario:active{ transform: translateY(1px); }
  .msg-erro{
    background: rgba(217,97,79,.12);
    border: 1px solid rgba(217,97,79,.4);
    color: #F1A79C;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    display:none;
  }
  .msg-erro.mostrar{ display:block; }

  /* ---------- APP ---------- */
  #tela-app{ display:none; min-height: 100vh; }
  header.topo{
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 0;
  }
  .linha-topo{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .marca{ display:flex; flex-direction:column; }
  .marca .selo{ margin-bottom: 2px; }
  .marca h2{ font-family: var(--font-display); font-size: 17px; margin:0; font-weight:600; }
  .acoes-topo{ display:flex; gap:8px; }
  .icone-btn{
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    cursor:pointer;
    font-size: 16px;
  }
  .icone-btn:active{ background: var(--surface-2); }
  .busca-wrap{ margin-bottom: 12px; }
  .busca-wrap input{ font-family: var(--font-mono); font-size: 14px; }

  /* abas em formato de ficha/pasta */
  nav.abas{
    display:flex;
    gap: 4px;
    padding: 0 2px;
  }
  nav.abas button{
    flex:1;
    appearance:none; border:none; cursor:pointer;
    background: var(--surface);
    color: var(--muted);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12.5px;
    padding: 10px 6px 9px;
    clip-path: polygon(8% 0, 92% 0, 100% 100%, 0% 100%);
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    transition: transform .15s ease, background .15s ease, color .15s ease;
    position: relative;
    top: 4px;
  }
  nav.abas button.ativa{
    background: var(--surface-2);
    color: var(--ink);
    top: 0;
    transform: translateY(0);
    z-index: 2;
  }
  nav.abas button[data-modulo="pastas"].ativa{ box-shadow: inset 0 3px 0 var(--accent); }
  nav.abas button[data-modulo="pp"].ativa{ box-shadow: inset 0 3px 0 var(--sage); }
  nav.abas button[data-modulo="doc"].ativa{ box-shadow: inset 0 3px 0 var(--blue); }

  main{ padding: 16px; padding-bottom: 90px; }

  .barra-info{
    display:flex; align-items:center; justify-content:space-between;
    font-size: 12px; color: var(--muted);
    margin-bottom: 12px;
    font-family: var(--font-mono);
  }
  .barra-info .refazer{
    color: var(--accent);
    cursor:pointer;
    font-weight: 600;
  }

  /* cartão de índice (item da lista) */
  .cartao{
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display:block;
    text-decoration:none;
    color: inherit;
  }
  .cartao.cor-pastas{ border-left-color: var(--accent); }
  .cartao.cor-produto{ border-left-color: var(--sage); }
  .cartao.cor-projeto{ border-left-color: #8B7FC4; }
  .cartao.cor-doc{ border-left-color: var(--blue); }

  .cartao .titulo{
    font-weight: 600;
    font-size: 14.5px;
    margin-bottom: 3px;
  }
  .cartao .caminho{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    word-break: break-word;
    margin-bottom: 6px;
  }
  .cartao .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-size: 10.5px;
    font-family: var(--font-mono);
    padding: 2px 7px;
    border-radius: 100px;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--line);
  }

  details.grupo{ margin-bottom: 14px; }
  details.grupo > summary{
    cursor:pointer;
    list-style:none;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 10px;
    display:flex;
    justify-content: space-between;
    align-items:center;
  }
  details.grupo > summary::-webkit-details-marker{ display:none; }
  details.grupo > summary .contagem{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  .vazio{
    text-align:center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 10px;
    font-family: var(--font-mono);
  }
  .carregando{
    text-align:center;
    color: var(--muted);
    font-size: 13px;
    padding: 30px 10px;
  }

  /* modal simples (reprocessar / config) */
  .modal-fundo{
    display:none;
    position: fixed; inset:0;
    background: rgba(10,12,15,.7);
    z-index: 50;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-fundo.mostrar{ display:flex; }
  .modal{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius) var(--radius) 0 0;
    width:100%;
    max-width: 480px;
    padding: 20px;
    padding-bottom: 28px;
  }
  .modal h3{ font-family: var(--font-display); margin:0 0 14px; font-size:17px; }
  .opcao-modulo{
    width:100%;
    text-align:left;
    background: var(--surface-2);
    border:1px solid var(--line);
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor:pointer;
    font-size: 14px;
  }
  .status-linha{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 16px;
  }
  .fechar-modal{
    display:block;
    text-align:center;
    margin-top: 14px;
    color: var(--muted);
    font-size: 13px;
    cursor:pointer;
  }

  @media (min-width: 720px){
    main{ max-width: 900px; margin: 0 auto; }
    header.topo{ padding-left: calc(50% - 450px); padding-right: calc(50% - 450px); }
    .linha-topo{ padding-top:2px; }
  }
</style>
</head>
<body>

<!-- ===================== TELA DE LOGIN ===================== -->
<div id="tela-login">
  <div class="cartao-login">
    <div class="selo">Central do Conhecimento EU+</div>
    <h1>Painel de acesso ao Drive</h1>
    <p class="sub">Digite a senha para abrir o mapeamento de pastas, produtos, projetos e documentos.</p>

    <div class="msg-erro" id="erro-login"></div>

    <div class="campo">
      <label for="campo-senha">Senha de acesso</label>
      <input type="password" id="campo-senha" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <details class="avancado" id="detalhes-conexao">
      <summary>⚙ configurar conexão</summary>
      <div class="campo">
        <label for="campo-url">URL do App da Web (Apps Script)</label>
        <input type="text" id="campo-url" placeholder="https://script.google.com/macros/s/.../exec" />
      </div>
    </details>

    <button class="btn btn-primario" id="btn-entrar">Entrar</button>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="tela-app">
  <header class="topo">
    <div class="linha-topo">
      <div class="marca">
        <div class="selo">Central do Conhecimento EU+</div>
        <h2>Painel do Drive</h2>
      </div>
      <div class="acoes-topo">
        <div class="icone-btn" id="btn-config" title="Configurar conexão">⚙</div>
        <div class="icone-btn" id="btn-sair" title="Sair">⏻</div>
      </div>
    </div>
    <div class="busca-wrap">
      <input type="search" id="campo-busca" placeholder="buscar://" />
    </div>
    <nav class="abas">
      <button class="ativa" data-modulo="pastas">Pastas</button>
      <button data-modulo="pp">Produtos &amp; Projetos</button>
      <button data-modulo="doc">Documentos</button>
    </nav>
  </header>

  <main>
    <div class="barra-info">
      <span id="info-contagem">—</span>
      <span class="refazer" id="btn-reprocessar">↻ reprocessar</span>
    </div>
    <div id="conteudo"></div>
  </main>
</div>

<!-- ===================== MODAL: REPROCESSAR ===================== -->
<div class="modal-fundo" id="modal-reprocessar">
  <div class="modal">
    <h3>Reprocessar mapeamento</h3>
    <button class="opcao-modulo" data-modulo="pastas">📁 Todas as pastas do Drive</button>
    <button class="opcao-modulo" data-modulo="projetosProdutos">🧩 Produtos e Projetos</button>
    <button class="opcao-modulo" data-modulo="documental">📄 Mapeamento Documental</button>
    <div class="status-linha" id="status-reprocessar"></div>
    <div class="fechar-modal" id="fechar-modal-reprocessar">fechar</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- estado / storage ----------
  const LS_URL = 'eudrive_url';
  const LS_TOKEN = 'eudrive_token';
  const LS_TOKEN_EXP = 'eudrive_token_exp';

  let estado = {
    url: localStorage.getItem(LS_URL) || '',
    token: localStorage.getItem(LS_TOKEN) || '',
    tokenExp: parseInt(localStorage.getItem(LS_TOKEN_EXP) || '0', 10)
  };

  let cache = { pastas: null, pp: null, doc: null };
  let abaAtual = 'pastas';
  let poller = null;

  // ---------- elementos ----------
  const telaLogin = document.getElementById('tela-login');
  const telaApp = document.getElementById('tela-app');
  const campoSenha = document.getElementById('campo-senha');
  const campoUrlLogin = document.getElementById('campo-url');
  const btnEntrar = document.getElementById('btn-entrar');
  const erroLogin = document.getElementById('erro-login');
  const campoBusca = document.getElementById('campo-busca');
  const conteudo = document.getElementById('conteudo');
  const infoContagem = document.getElementById('info-contagem');
  const btnSair = document.getElementById('btn-sair');
  const btnConfig = document.getElementById('btn-config');
  const btnReprocessar = document.getElementById('btn-reprocessar');
  const modalReprocessar = document.getElementById('modal-reprocessar');
  const fecharModalReprocessar = document.getElementById('fechar-modal-reprocessar');
  const statusReprocessar = document.getElementById('status-reprocessar');

  // ---------- helpers ----------
  function normalizar(txt){
    return String(txt == null ? '' : txt)
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function sessaoValida(){
    return estado.token && estado.tokenExp > Date.now();
  }

  async function chamarApi(action, payload){
    if (!estado.url) throw new Error('URL do App da Web não configurada.');
    const corpo = Object.assign({ action, token: estado.token }, payload || {});
    const resp = await fetch(estado.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
      body: JSON.stringify(corpo)
    });
    const json = await resp.json();
    return json;
  }

  function linhasParaObjetos(dados){
    if (!dados || !dados.headers) return [];
    return dados.rows.map(linha => {
      const obj = {};
      dados.headers.forEach((h, i) => { obj[h] = linha[i]; });
      return obj;
    });
  }

  // ---------- login ----------
  async function tentarEntrar(){
    erroLogin.classList.remove('mostrar');
    const senha = campoSenha.value.trim();
    const url = campoUrlLogin.value.trim();
    if (url) estado.url = url;

    if (!estado.url){
      erroLogin.textContent = 'Informe a URL do App da Web em "configurar conexão".';
      erroLogin.classList.add('mostrar');
      return;
    }
    if (!senha){
      erroLogin.textContent = 'Digite a senha de acesso.';
      erroLogin.classList.add('mostrar');
      return;
    }

    btnEntrar.textContent = 'Entrando...';
    btnEntrar.disabled = true;
    try{
      const r = await chamarApi('login', { senha });
      if (r.ok){
        estado.token = r.token;
        estado.tokenExp = Date.now() + (11.5 * 60 * 60 * 1000); // 11h30 de margem
        localStorage.setItem(LS_URL, estado.url);
        localStorage.setItem(LS_TOKEN, estado.token);
        localStorage.setItem(LS_TOKEN_EXP, String(estado.tokenExp));
        campoSenha.value = '';
        abrirApp();
      } else {
        erroLogin.textContent = r.erro || 'Não foi possível entrar.';
        erroLogin.classList.add('mostrar');
      }
    } catch(e){
      erroLogin.textContent = 'Erro de conexão: ' + e.message;
      erroLogin.classList.add('mostrar');
    } finally {
      btnEntrar.textContent = 'Entrar';
      btnEntrar.disabled = false;
    }
  }

  function sair(){
    estado.token = '';
    estado.tokenExp = 0;
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_TOKEN_EXP);
    cache = { pastas: null, pp: null, doc: null };
    telaApp.style.display = 'none';
    telaLogin.style.display = 'flex';
  }

  function abrirApp(){
    telaLogin.style.display = 'none';
    telaApp.style.display = 'block';
    carregarAba(abaAtual, false);
  }

  // ---------- carregamento de abas ----------
  async function carregarAba(modulo, forcar){
    abaAtual = modulo;
    document.querySelectorAll('nav.abas button').forEach(b=>{
      b.classList.toggle('ativa', b.dataset.modulo === modulo);
    });
    campoBusca.value = '';

    const chaveCache = modulo === 'pastas' ? 'pastas' : (modulo === 'pp' ? 'pp' : 'doc');
    if (cache[chaveCache] && !forcar){
      renderizarAba(modulo);
      return;
    }

    conteudo.innerHTML = '<div class="carregando">carregando dados...</div>';
    try{
      let acao = modulo === 'pastas' ? 'getPastas' : (modulo === 'pp' ? 'getProjetosProdutos' : 'getDocumentos');
      const r = await chamarApi(acao, {});
      if (!r.ok){
        if (r.erro && r.erro.indexOf('Sessão') !== -1){ sair(); return; }
        conteudo.innerHTML = '<div class="vazio">Erro ao carregar: ' + (r.erro||'desconhecido') + '</div>';
        return;
      }
      cache[chaveCache] = linhasParaObjetos(r.dados);
      renderizarAba(modulo);
    } catch(e){
      conteudo.innerHTML = '<div class="vazio">Erro de conexão: ' + e.message + '</div>';
    }
  }

  function itensFiltrados(lista, termo){
    if (!termo) return lista;
    const t = normalizar(termo);
    return lista.filter(obj => Object.values(obj).some(v => normalizar(v).indexOf(t) !== -1));
  }

  function renderizarAba(modulo){
    const termo = campoBusca.value.trim();
    if (modulo === 'pastas') renderPastas(itensFiltrados(cache.pastas || [], termo));
    if (modulo === 'pp') renderProjetosProdutos(itensFiltrados(cache.pp || [], termo));
    if (modulo === 'doc') renderDocumentos(itensFiltrados(cache.doc || [], termo));
  }

  function renderPastas(lista){
    infoContagem.textContent = lista.length + ' pasta(s)';
    if (!lista.length){ conteudo.innerHTML = '<div class="vazio">Nenhuma pasta encontrada.</div>'; return; }
    conteudo.innerHTML = lista.map(p => `
      <a class="cartao cor-pastas" href="${p['URL']||'#'}" target="_blank" rel="noopener">
        <div class="titulo">${escapar(p['Nome'])}</div>
        <div class="caminho">${escapar(p['Caminho Completo'])}</div>
        <div class="chips">
          <span class="chip">nível ${escapar(p['Nível'])}</span>
          <span class="chip">${escapar(p['Última Modificação'])}</span>
        </div>
      </a>
    `).join('');
  }

  function renderProjetosProdutos(lista){
    infoContagem.textContent = lista.length + ' item(ns)';
    if (!lista.length){ conteudo.innerHTML = '<div class="vazio">Nenhum item encontrado.</div>'; return; }

    const grupos = {};
    lista.forEach(item => {
      const chave = item['Categoria'] + ' | ' + item['Produto/Projeto (Raiz)'];
      if (!grupos[chave]) grupos[chave] = { categoria: item['Categoria'], raiz: item['Produto/Projeto (Raiz)'], itens: [] };
      grupos[chave].itens.push(item);
    });

    conteudo.innerHTML = Object.values(grupos).map(g => `
      <details class="grupo" open>
        <summary>
          <span>${g.categoria === 'Produto' ? '🧩' : '📌'} ${escapar(g.raiz)}</span>
          <span class="contagem">${g.itens.length}</span>
        </summary>
        ${g.itens.map(it => `
          <a class="cartao ${g.categoria === 'Produto' ? 'cor-produto' : 'cor-projeto'}" href="${it['URL']||'#'}" target="_blank" rel="noopener">
            <div class="titulo">${escapar(it['Nome'])}</div>
            <div class="caminho">${escapar(it['Caminho Completo'])}</div>
            <div class="chips">
              <span class="chip">${escapar(g.categoria)}</span>
              <span class="chip">${escapar(it['Última Modificação'])}</span>
            </div>
          </a>
        `).join('')}
      </details>
    `).join('');
  }

  function renderDocumentos(lista){
    infoContagem.textContent = lista.length + ' arquivo(s)';
    if (!lista.length){ conteudo.innerHTML = '<div class="vazio">Nenhum documento encontrado.</div>'; return; }

    const grupos = {};
    lista.forEach(item => {
      const chave = item['Categoria'];
      if (!grupos[chave]) grupos[chave] = [];
      grupos[chave].push(item);
    });

    conteudo.innerHTML = Object.keys(grupos).map(cat => `
      <details class="grupo" open>
        <summary>
          <span>📁 ${escapar(cat)}</span>
          <span class="contagem">${grupos[cat].length}</span>
        </summary>
        ${grupos[cat].map(doc => `
          <a class="cartao cor-doc" href="${doc['URL']||'#'}" target="_blank" rel="noopener">
            <div class="titulo">${escapar(doc['Nome'])}</div>
            <div class="caminho">${escapar(doc['Pasta (Nome)'])}</div>
            <div class="chips">
              <span class="chip">${escapar(doc['Tipo'])}</span>
              ${doc['Subcategoria'] ? '<span class="chip">'+escapar(doc['Subcategoria'])+'</span>' : ''}
              <span class="chip">${escapar(doc['Tamanho (MB)'])} MB</span>
              <span class="chip">${escapar(doc['Última Modificação'])}</span>
            </div>
          </a>
        `).join('')}
      </details>
    `).join('');
  }

  function escapar(txt){
    const d = document.createElement('div');
    d.textContent = txt == null ? '' : String(txt);
    return d.innerHTML;
  }

  // ---------- reprocessar ----------
  function abrirModalReprocessar(){
    modalReprocessar.classList.add('mostrar');
    statusReprocessar.textContent = '';
  }
  function fecharModal(){
    modalReprocessar.classList.remove('mostrar');
    if (poller) clearInterval(poller);
  }

  async function iniciarReprocessamento(modulo){
    statusReprocessar.textContent = 'Iniciando...';
    try{
      const r = await chamarApi('remapear', { modulo });
      if (!r.ok){ statusReprocessar.textContent = 'Erro: ' + r.erro; return; }
      statusReprocessar.textContent = r.mensagem;
      acompanharStatus(modulo);
    } catch(e){
      statusReprocessar.textContent = 'Erro de conexão: ' + e.message;
    }
  }

  function acompanharStatus(modulo){
    if (poller) clearInterval(poller);
    poller = setInterval(async () => {
      try{
        const r = await chamarApi('status', { modulo });
        if (!r.ok) return;
        statusReprocessar.textContent = 'Status: ' + r.status + ' · mapeados: ' + r.total + ' · na fila: ' + r.restante;
        if (r.status === 'concluído'){
          clearInterval(poller);
          const chaveCache = modulo === 'pastas' ? 'pastas' : (modulo === 'projetosProdutos' ? 'pp' : 'doc');
          cache[chaveCache] = null; // força recarregar na próxima vez que abrir a aba
        }
      } catch(e){ /* silencioso, tenta de novo no próximo ciclo */ }
    }, 4000);
  }

  // ---------- eventos ----------
  btnEntrar.addEventListener('click', tentarEntrar);
  campoSenha.addEventListener('keydown', e => { if (e.key === 'Enter') tentarEntrar(); });

  btnSair.addEventListener('click', sair);
  btnConfig.addEventListener('click', () => {
    const novaUrl = prompt('URL do App da Web (Apps Script):', estado.url);
    if (novaUrl !== null && novaUrl.trim()){
      estado.url = novaUrl.trim();
      localStorage.setItem(LS_URL, estado.url);
    }
  });

  document.querySelectorAll('nav.abas button').forEach(b => {
    b.addEventListener('click', () => carregarAba(b.dataset.modulo, false));
  });

  campoBusca.addEventListener('input', () => renderizarAba(abaAtual));

  btnReprocessar.addEventListener('click', abrirModalReprocessar);
  fecharModalReprocessar.addEventListener('click', fecharModal);
  document.querySelectorAll('.opcao-modulo').forEach(b => {
    b.addEventListener('click', () => iniciarReprocessamento(b.dataset.modulo));
  });

  // ---------- inicialização ----------
  campoUrlLogin.value = estado.url;
  if (sessaoValida()){
    abrirApp();
  }
})();
</script>
</body>
</html>
